name: Auto Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.0) — leave empty for auto bump'
        required: false
        default: ''
      release_type:
        description: 'Version bump type (used with auto mode)'
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  tag:
    name: Create Version Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.version }}" ]; then
              echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
              exit 0
            fi
            BUMP="${{ github.event.inputs.release_type }}"
          else
            BUMP="patch"
          fi

          LATEST_TAG=$(git tag --sort=-creatordate | head -1)

          # If no tags exist yet, start fresh
          if [ -z "$LATEST_TAG" ]; then
            echo "version=v0.1.0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Count unreleased commits
          UNRELEASED=$(git rev-list "$LATEST_TAG..HEAD" --count 2>/dev/null || echo "0")
          if [ "$UNRELEASED" -eq 0 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No new commits since last tag. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CLEAN="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH + 1)) ;;
          esac

          echo "version=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Skip if no new commits
        if: steps.version.outputs.skip == 'true'
        run: echo "No new commits. Skipping release tag creation."

      - name: Create and Push Tag
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
          echo "Created tag: ${{ steps.version.outputs.version }}"
