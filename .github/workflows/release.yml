name: Shodasha Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Release Desktop App (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            tracker

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Checks
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Next.js 16 Frontend
        run: npm run build

      - name: Build Background Tracker Binary (tracker.exe)
        run: cargo build --manifest-path tracker/Cargo.toml --release

      - name: Copy Tracker Binary for Tauri Bundle
        run: |
          mkdir -p target/release
          cp tracker/target/release/tracker.exe target/release/tracker.exe

      - name: Build & Publish Release with Tauri Action
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Shodasha Desktop Productivity App ${{ github.ref_name }}'
          releaseBody: |
            # 🚀 Shodasha Productivity Engine — ${{ github.ref_name }}
            
            Shodasha is a local-first, privacy-focused desktop productivity tracker built with **Tauri v2**, **Next.js 16**, **React 19**, **Rust**, and **SQLite**.

            ---

            ## ✨ Key Features in this Release
            - 🎯 **Daily Focus Target Engine**: Set custom daily targets (e.g., 6.0h/day) with progress rings.
            - 📊 **Productivity Index (0-100 Focus Score)**: Real-time weighted efficiency analysis (Deep Work vs Distraction).
            - 📈 **Interactive Chart Cross-Filtering**: Click any day in the usage bar chart to filter active periods and app rankings.
            - 🔄 **Date Range Comparison Tool**: "This Week vs Last Week" overlay comparison delta stats.
            - 🏆 **Habit Streaks & Focus Hour Milestones**: Earn badges for completed focus milestones.
            - ⏱️ **Kanban Desktop Time-Tracking**: Task cards display total desktop time logged (`⏱️ 2h 45m logged`).
            - 🔔 **Dual-Channel Web & Toast Notifications**: In-app toast alerts paired with native OS alerts.
            - 🌙 **Warm Linen & Espresso Dark Theme**: Zero eye-strain color palettes with contrast dropdowns.
            - ⚡ **Background Tray & Auto-Start**: Minimizes to system tray on close with zero background CPU overhead.

            ---

            ## 📥 Installation Instructions (Windows)
            1. Download the attached `.msi` or `.exe` installer below.
            2. Run the installer to set up **Shodasha**.
            3. Launch the app — it will sit in your system tray and passively track your focus time offline.

            ---

            ## 🔒 Privacy Guarantee
            100% Offline & On-Device. Your activity data never leaves your computer.
          releaseDraft: false
          prerelease: false
