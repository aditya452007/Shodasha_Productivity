name: Shodasha Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version (e.g. v0.2.0) — leave empty for auto bump'
        required: false
        default: ''
      release_type:
        description: 'Auto bump type'
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Desktop App
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(git tag --sort=-creatordate | head -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "version=v0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UNRELEASED=$(git rev-list "$LATEST_TAG..HEAD" --count 2>/dev/null || echo "0")
          if [ "$UNRELEASED" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP="patch"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && BUMP="${{ github.event.inputs.release_type }}"

          CLEAN="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          echo "version=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.version.outputs.skip == 'true'
        run: echo "No unreleased commits since last tag."

      - name: Setup Node.js
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust toolchain
        if: steps.version.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        if: steps.version.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            tracker

      - name: Install frontend dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Build Next.js frontend
        if: steps.version.outputs.skip != 'true'
        run: npm run build

      - name: Build background tracker binary
        if: steps.version.outputs.skip != 'true'
        run: cargo build --manifest-path tracker/Cargo.toml --release

      - name: Copy tracker binary for Tauri bundle
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p target/release
          cp tracker/target/release/tracker.exe target/release/tracker.exe

      - name: Build Tauri app (MSI + NSIS installers)
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          npx tauri build --bundles "msi,nsis" 2>&1

      - name: List built installer files
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          echo "=== MSI files ==="
          find src-tauri/target/release -name "*.msi" -type f 2>/dev/null || echo "No MSI found"
          echo "=== NSIS/EXE files ==="
          find src-tauri/target/release -name "*.exe" -type f 2>/dev/null || echo "No EXE found"
          echo "=== All bundle files ==="
          find src-tauri/target/release/bundle -type f 2>/dev/null || echo "No bundle dir"

      - name: Generate release body
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          cat > release_body.md << 'EOF'
          # Shodasha Productivity Engine

          A local-first, privacy-focused desktop productivity tracker that fuses passive Windows activity tracking, habit tracking, and kanban task management into a single, beautiful desktop app — 100% offline, no accounts, no cloud.

          ---

          ## ✨ Features

          - **Kanban Board** — Drag-and-drop task cards with customizable columns and desktop time-tracking
          - **Habit Tracking** — Daily check-ins with calendar heatmaps, streak tracking, and milestone badges
          - **Passive Time Tracking** — Automatically tracks foreground windows via background Rust service (no manual timers)
          - **Interactive Dashboard** — Real-time focus score (0-100), time distribution charts, progress rings
          - **Timeline Analytics** — Daily timeline, weekly charts, app usage breakdown, date range comparison
          - **Focus Target Engine** — Set daily focus goals with live progress rings
          - **Background Tray & Auto-Start** — Minimizes to system tray with near-zero CPU overhead
          - **Dual-Channel Notifications** — In-app toasts paired with native OS alerts
          - **Warm Dark Theme** — Eye-strain-reduced linen & espresso palette with contrast options
          - **100% Offline** — Zero data leaves your machine. No telemetry, no cloud

          ---

          ## 📥 Installation

          **System Requirements:** Windows 10 or later (64-bit)

          Download the **.msi** or **.exe** installer attached below and run it.

          ---

          ## 🔒 Privacy Guarantee

          100% offline. All activity data, tasks, and habits live exclusively in a local SQLite database. Shodasha never phones home.

          ---

          ## 🧾 What's Changed
          EOF

          echo "" >> release_body.md

          LAST_TAG=$(git tag --sort=-creatordate | head -1)
          if [ "$LAST_TAG" = "$VERSION" ] || [ -z "$LAST_TAG" ]; then
            LAST_TAG=""
          fi

          if [ -n "$LAST_TAG" ]; then
            git log "$LAST_TAG..HEAD" --oneline --no-decorate | while IFS= read -r line; do
              echo "- $line" >> release_body.md
            done
            echo "" >> release_body.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$LAST_TAG...$VERSION" >> release_body.md
          else
            git log --oneline --no-decorate | while IFS= read -r line; do
              echo "- $line" >> release_body.md
            done
            echo "" >> release_body.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/$VERSION" >> release_body.md
          fi

      - name: Create GitHub Release with installers
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Shodasha Desktop App ${{ steps.version.outputs.version }}
          body_path: release_body.md
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
